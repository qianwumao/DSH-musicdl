plugins {
    id 'com.android.application'
}

android {
    namespace 'com.musicdl.android'
    compileSdk 37

    defaultConfig {
        applicationId 'com.musicdl.android'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
